<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 208" width="880" height="208" role="img" aria-label="NO-DO.DEV — TRACEZ investigates. GRIMZ operates. One core.">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#4a4436" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="880" height="208" rx="10" fill="#0d0c0a"/>
  <rect width="880" height="208" rx="10" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="879" height="207" rx="9.5" fill="none" stroke="#4a4436" stroke-opacity=".55"/>

  <!-- brand mark: TRACEZ + GRIMZ converging on the core -->
  <g transform="translate(52 62) scale(1.9)">
    <path d="M12,14 L22,22 M32,14 L22,22 M22,22 L22,32" stroke="#4a4436" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="12" cy="14" r="5" fill="#4fd1c5"/>
    <circle cx="32" cy="14" r="5" fill="#22d3ee"/>
    <rect x="16" y="26" width="12" height="12" rx="1.5" transform="rotate(45 22 32)" fill="#0d0c0a" stroke="#ff5a36" stroke-width="2.2"/>
  </g>

  <g class="mono">
    <text x="186" y="84" fill="#e9e3d5" font-size="33" font-weight="700" letter-spacing="1.4">NO-DO.DEV</text>
    <text x="188" y="120" font-size="15.5" letter-spacing=".2">
      <tspan fill="#4fd1c5" font-weight="700">TRACEZ</tspan><tspan fill="#8a8272"> investigates. </tspan><tspan fill="#ff5a36" font-weight="700">GRIMZ</tspan><tspan fill="#8a8272"> operates. </tspan><tspan fill="#e9e3d5">One core.</tspan>
    </text>
    <text x="188" y="149" fill="#6f6857" font-size="11.5" letter-spacing="1.3">OSINT  ·  GEOINT  ·  AUTHORIZED PENTESTING</text>
  </g>

  <!-- separator -->
  <line x1="632" y1="46" x2="632" y2="162" stroke="#4a4436" stroke-opacity=".45"/>

  <!-- the cycle: investigate -> authorize -> operate -->
  <g class="mono">
    <line x1="838" y1="60" x2="838" y2="148" stroke="#4a4436" stroke-opacity=".7" stroke-width="1.5"/>

    <text x="664" y="65" fill="#6f6857" font-size="10.5" letter-spacing="1">01</text>
    <text x="694" y="65" fill="#4fd1c5" font-size="12.5" font-weight="700" letter-spacing=".6">INVESTIGATE</text>
    <circle cx="838" cy="60" r="5.5" fill="#4fd1c5"/>

    <text x="664" y="109" fill="#6f6857" font-size="10.5" letter-spacing="1">02</text>
    <text x="694" y="109" fill="#8a8272" font-size="12.5" font-weight="700" letter-spacing=".6">AUTHORIZE</text>
    <rect x="832" y="98" width="11" height="11" rx="1.2" transform="rotate(45 837.5 103.5)" fill="#0d0c0a" stroke="#8a8272" stroke-width="2"/>

    <text x="664" y="153" fill="#6f6857" font-size="10.5" letter-spacing="1">03</text>
    <text x="694" y="153" fill="#ff5a36" font-size="12.5" font-weight="700" letter-spacing=".6">OPERATE</text>
    <circle cx="838" cy="148" r="5.5" fill="#ff5a36"/>
  </g>

  <!-- discreet signature: product in production -->
  <text class="mono" x="186" y="180" fill="#4a4436" font-size="9.5" letter-spacing="2.2">IN PRODUCTION · OWN INFRASTRUCTURE · EU</text>
</svg>
