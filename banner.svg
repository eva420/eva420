<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 208" width="880" height="208" role="img" aria-label="NO-DO.DEV — TRACEZ investigates. GRIMZ operates. One core.">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#2b353c" stroke-opacity=".38" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Paleta = tokens de no-do.dev/style.css: bg #07090b, line #1b2228,
       line-hi #2b353c, ink #eef2f0, ink-2 #b9c3c2, muted #7d8a89,
       tracez #e8a33d, grimz #2ee6d6. -->
  <rect width="880" height="208" rx="10" fill="#07090b"/>
  <rect width="880" height="208" rx="10" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="879" height="207" rx="9.5" fill="none" stroke="#2b353c" stroke-opacity=".7"/>

  <!-- brand mark: el mismo de hub/favicon.svg (viewBox 32) sin fondo.
       Nodo hueco -> arista -> nodo resuelto: el enlace que da nombre a NO-DO. -->
  <g transform="translate(56 62) scale(2.6)">
    <path d="M11.2 20.8 L20.8 11.2" stroke="#eef2f0" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <circle cx="7" cy="25" r="4.2" fill="none" stroke="#eef2f0" stroke-width="2.4"/>
    <circle cx="25" cy="7" r="4.2" fill="#eef2f0"/>
  </g>

  <g class="mono">
    <text x="186" y="84" fill="#eef2f0" font-size="33" font-weight="700" letter-spacing="1.4">NO-DO.DEV</text>
    <text x="188" y="120" font-size="15.5" letter-spacing=".2">
      <tspan fill="#e8a33d" font-weight="700">TRACEZ</tspan><tspan fill="#b9c3c2"> investigates. </tspan><tspan fill="#2ee6d6" font-weight="700">GRIMZ</tspan><tspan fill="#b9c3c2"> operates. </tspan><tspan fill="#eef2f0">One core.</tspan>
    </text>
    <text x="188" y="149" fill="#7d8a89" font-size="11.5" letter-spacing="1.3">OSINT  ·  GEOINT  ·  AUTHORIZED PENTESTING</text>
  </g>

  <!-- separator -->
  <line x1="632" y1="46" x2="632" y2="162" stroke="#2b353c" stroke-opacity=".8"/>

  <!-- the cycle: investigate -> authorize -> operate, con el vocabulario del
       mark: nodo hueco (pregunta) -> arista -> nodo resuelto. -->
  <g class="mono">
    <line x1="838" y1="60" x2="838" y2="148" stroke="#2b353c" stroke-width="1.5"/>

    <text x="664" y="65" fill="#7d8a89" font-size="10.5" letter-spacing="1">01</text>
    <text x="694" y="65" fill="#e8a33d" font-size="12.5" font-weight="700" letter-spacing=".6">INVESTIGATE</text>
    <circle cx="838" cy="60" r="5" fill="#07090b" stroke="#e8a33d" stroke-width="2.4"/>

    <text x="664" y="109" fill="#7d8a89" font-size="10.5" letter-spacing="1">02</text>
    <text x="694" y="109" fill="#b9c3c2" font-size="12.5" font-weight="700" letter-spacing=".6">AUTHORIZE</text>
    <circle cx="838" cy="104" r="5" fill="#07090b" stroke="#eef2f0" stroke-width="2.4"/>
    <circle cx="838" cy="104" r="1.9" fill="#eef2f0"/>

    <text x="664" y="153" fill="#7d8a89" font-size="10.5" letter-spacing="1">03</text>
    <text x="694" y="153" fill="#2ee6d6" font-size="12.5" font-weight="700" letter-spacing=".6">OPERATE</text>
    <circle cx="838" cy="148" r="6.2" fill="#2ee6d6"/>
  </g>

  <!-- discreet signature: product in production -->
  <text class="mono" x="186" y="180" fill="#7d8a89" fill-opacity=".6" font-size="9.5" letter-spacing="2.2">IN PRODUCTION · OWN INFRASTRUCTURE · EU</text>
</svg>
